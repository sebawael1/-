<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدينتكم — مدينتك بانتظارك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Segoe UI', 'Tahoma', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#28664F',
              hover: '#205340',
              light: '#EAF3EF',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-white text-[#111827] antialiased selection:bg-[#28664F] selection:text-white">
  <div dir="ltr" class="min-h-screen w-full flex flex-col lg:flex-row">
    
    <!-- Left Hero Panel -->
    <div class="relative w-full lg:w-[58.5%] min-h-[340px] lg:min-h-screen bg-[#122620] overflow-hidden select-none">
      <img
        src="/assets/riyadh-hero.png"
        alt="الرياض، كما تحبها - حياتك في المدينة أكثر اتصالاً"
        class="w-full h-full object-cover object-center"
      />
    </div>

    <!-- Right Form Panel -->
    <div dir="rtl" class="w-full lg:w-[41.5%] min-h-screen bg-white flex flex-col justify-between px-7 sm:px-12 xl:px-16 py-8">
      
      <!-- Top Bar: Logo on Right, EN on Left -->
      <header class="w-full flex items-center justify-between">
        <a href="/" class="inline-flex items-center focus:outline-none" aria-label="مدينتكم">
          <img
            src="/assets/logo.png"
            alt="شعار مدينتكم"
            class="h-12 w-auto object-contain"
          />
        </a>
        <button
          type="button"
          class="text-xs font-semibold text-slate-500 hover:text-slate-800 tracking-wider transition px-2 py-1 rounded"
        >
          EN
        </button>
      </header>

      <!-- Center Authentication Form -->
      <main class="w-full max-w-[420px] mx-auto my-auto py-6">
        <div class="text-right mb-6">
          <h1 id="form-title" class="text-[28px] sm:text-[31px] font-extrabold text-[#111827] leading-tight">
            مدينتك بانتظارك.
          </h1>
          <p id="form-subtitle" class="text-[13.5px] text-slate-400 font-medium mt-1.5">
            سجّل دخولك، وخلّ يومك أسهل.
          </p>
        </div>

        <!-- Status Alert Box (Loading / Success / Error) -->
        <div
          id="status-banner"
          class="hidden mb-5 rounded-xl p-4 text-xs leading-relaxed border transition-all"
          role="alert"
          aria-live="polite"
        ></div>

        <form id="auth-form" class="space-y-4" novalidate>
          <!-- Full Name Field (Shown in Sign Up mode) -->
          <div id="field-wrapper-full_name" class="hidden">
            <label for="full_name" class="block text-right text-[12px] font-bold text-slate-600 mb-1.5">
              الاسم الكامل
            </label>
            <input
              id="full_name"
              name="full_name"
              type="text"
              autocomplete="name"
              placeholder="الاسم الثلاثي أو الكامل"
              class="w-full rounded-lg border border-slate-200 bg-white px-3.5 py-2.5 text-[13px] text-slate-800 placeholder-slate-400 transition focus:border-[#28664F] focus:outline-none focus:ring-2 focus:ring-[#28664F]/15"
            />
            <p id="error-full_name" class="hidden mt-1 text-[11px] font-medium text-red-600"></p>
          </div>

          <!-- Email Field -->
          <div>
            <label for="email" class="block text-right text-[12px] font-bold text-slate-600 mb-1.5">
              البريد الإلكتروني
            </label>
            <input
              id="email"
              name="email"
              type="email"
              dir="ltr"
              autocomplete="email"
              placeholder="name@example.com"
              class="w-full rounded-lg border border-slate-200 bg-white px-3.5 py-2.5 text-left text-[13px] text-slate-800 placeholder-slate-400 transition focus:border-[#28664F] focus:outline-none focus:ring-2 focus:ring-[#28664F]/15"
              required
            />
            <p id="error-email" class="hidden mt-1 text-[11px] font-medium text-red-600"></p>
          </div>

          <!-- Password Field -->
          <div>
            <label for="password" class="block text-right text-[12px] font-bold text-slate-600 mb-1.5">
              كلمة المرور
            </label>
            <input
              id="password"
              name="password"
              type="password"
              dir="ltr"
              autocomplete="current-password"
              placeholder="••••••••••••••"
              class="w-full rounded-lg border border-slate-200 bg-white px-3.5 py-2.5 text-left text-[13px] text-slate-800 placeholder-slate-400 transition focus:border-[#28664F] focus:outline-none focus:ring-2 focus:ring-[#28664F]/15"
              required
            />
            <p id="error-password" class="hidden mt-1 text-[11px] font-medium text-red-600"></p>
          </div>

          <!-- Technical Skill Field (Shown in Sign Up mode) -->
          <div id="field-wrapper-technical_skill" class="hidden">
            <label for="technical_skill" class="block text-right text-[12px] font-bold text-slate-600 mb-1.5">
              المهارة التقنية
            </label>
            <input
              id="technical_skill"
              name="technical_skill"
              type="text"
              list="technical-skills-list"
              placeholder="مثال: تطوير الويب (TypeScript)، الذكاء الاصطناعي، أتمتة n8n..."
              class="w-full rounded-lg border border-slate-200 bg-white px-3.5 py-2.5 text-[13px] text-slate-800 placeholder-slate-400 transition focus:border-[#28664F] focus:outline-none focus:ring-2 focus:ring-[#28664F]/15"
            />
            <datalist id="technical-skills-list">
              <option value="تطوير الواجهات الأمامية (TypeScript & Tailwind CSS)"></option>
              <option value="تطوير النظم الخلفية وقواعد البيانات (Supabase & Node.js)"></option>
              <option value="أتمتة العمليات والربط البرمجي (n8n & Make)"></option>
              <option value="الذكاء الاصطناعي وعلوم البيانات"></option>
              <option value="الأمن السيبراني وحماية الأنظمة"></option>
              <option value="الحوسبة السحابية و DevOps"></option>
            </datalist>
            <p id="error-technical_skill" class="hidden mt-1 text-[11px] font-medium text-red-600"></p>
          </div>

          <!-- Remember Me & Forgot Password Row -->
          <div class="flex items-center justify-between pt-0.5 pb-1">
            <label class="inline-flex items-center gap-2 cursor-pointer select-none">
              <input
                id="remember-me"
                type="checkbox"
                checked
                class="h-4 w-4 rounded border-slate-300 text-[#28664F] accent-[#28664F] focus:ring-[#28664F]"
              />
              <span class="text-[12px] text-slate-500 font-medium">تذكرني</span>
            </label>
            <button
              type="button"
              id="forgot-password-btn"
              class="text-[12px] font-bold text-[#28664F] hover:underline"
            >
              نسيت كلمة المرور؟
            </button>
          </div>

          <!-- Primary Green Action Button -->
          <button
            id="submit-btn"
            type="submit"
            class="w-full rounded-lg bg-[#28664F] hover:bg-[#205340] active:bg-[#194233] text-white font-bold text-[13.5px] py-3 px-4 transition flex items-center justify-center gap-2 shadow-sm disabled:opacity-65 disabled:cursor-not-allowed"
          >
            <span id="submit-btn-text">تسجيل الدخول</span>
            <svg
              id="submit-spinner"
              class="hidden animate-spin h-4 w-4 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
          </button>

          <!-- Secondary Google Button -->
          <button
            type="button"
            id="google-btn"
            class="w-full rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-bold text-[13px] py-2.5 px-4 transition flex items-center justify-center gap-2.5"
          >
            <span>المتابعة باستخدام Google</span>
            <svg class="h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#EA4335"
                d="M12 10.2v3.9h5.4c-.2 1.2-.9 2.3-2 3l3.2 2.5c1.9-1.7 3-4.3 3-7.3 0-.7-.1-1.4-.2-2.1H12z"
              />
              <path
                fill="#34A853"
                d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.2H3.1v2.6C4.7 19.8 8.1 22 12 22z"
              />
              <path
                fill="#4A90E2"
                d="M6.4 13.8c-.2-.6-.3-1.2-.3-1.8s.1-1.2.3-1.8V7.6H3.1C2.4 9 2 10.4 2 12s.4 3 1.1 4.4l3.3-2.6z"
              />
              <path
                fill="#FBBC05"
                d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 2.9 14.7 2 12 2 8.1 2 4.7 4.2 3.1 7.6l3.3 2.6c.8-2.4 3-4.3 5.6-4.3z"
              />
            </svg>
          </button>

          <!-- Mode Switcher (Sign In <-> Sign Up) -->
          <div class="pt-2 text-center">
            <span id="mode-switch-label" class="text-[12px] text-slate-500">ليس لديك حساب في مدينتكم؟</span>
            <button
              type="button"
              id="mode-switch-btn"
              class="mr-1 text-[12px] font-bold text-[#28664F] hover:underline focus:outline-none"
            >
              إنشاء حساب جديد
            </button>
          </div>
        </form>
      </main>

      <!-- Footer Links -->
      <footer class="w-full max-w-[420px] mx-auto text-right pt-4">
        <p class="text-[11px] text-slate-400">
          بمتابعتك، أنت توافق على شروط الاستخدام وسياسة الخصوصية.
        </p>
        <p class="mt-1">
          <a href="#support" onclick="return false;" class="text-[11.5px] font-bold text-[#28664F] hover:underline">
            تحتاج مساعدة؟ تواصل معنا
          </a>
        </p>
      </footer>
    </div>
  </div>

  <script type="module" src="/dist/app.js"></script>
</body>
</html>
