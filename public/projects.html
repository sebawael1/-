
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المشاريع التقنية</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: #f5f6fa;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    #projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .project {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    .project h2 {
      color: #6546c7;
    }

    .field {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>المشاريع التقنية</h1>

  <div id="projects">جاري تحميل المشاريع...</div>

  <script>
    async function loadProjects() {
      const container = document.getElementById("projects");

      try {
        const response = await fetch("/data/projects.json");

        if (!response.ok) {
          throw new Error("فشل تحميل البيانات");
        }

        const projects = await response.json();

        container.innerHTML = projects.map(project => `
          <div class="project">
            <h2>${project.name}</h2>
            <p>${project.description}</p>
            <p class="field">${project.field}</p>
            <p>التقنيات: ${project.technologies.join("، ")}</p>
          </div>
        `).join("");

      } catch (error) {
        container.textContent = "حدث خطأ أثناء تحميل المشاريع.";
        console.error(error);
      }
    }

    loadProjects();
  </script>

</body>
</html>
